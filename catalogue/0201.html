<h1>$F_2^{(0)}$</h1>
<hr>
<p>All <a href="../d/complex-hadamard-matrix.html">complex</a> $2\times 2$ Hadamard
matrices are <a href="../d/equivalence-relation.html">equivalent</a> to
the <a href="../d/fourier-matrix.html">Fourier</a>
matrix
$$F_2 = F_2^{(0)}=\left[\begin{array}{rr}1&amp;1\\1&amp;-1\end{array}\right]$$
which is an <a href="../d/isolated-matrix.html">isolated</a> point [<a href="../literature.html?a=32">32</a>],
[<a href="../literature.html?a=62">62</a>].
</p>
